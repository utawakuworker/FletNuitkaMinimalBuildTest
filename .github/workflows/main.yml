name: Build Minimal Flet + Sklearn Executable with Nuitka

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Copy sklearn.libs DLLs if they exist
      run: |
        python -c "import os, shutil, sklearn; src=os.path.join(os.path.dirname(sklearn.__file__), '../sklearn.libs'); src=os.path.normpath(src); dst='sklearn.libs'; os.makedirs(dst, exist_ok=True); [shutil.copy2(os.path.join(src, f), os.path.join(dst, f)) for f in os.listdir(src) if f.endswith('.dll')] if os.path.exists(src) else print('No sklearn.libs to copy')"

    - name: Debug List copied sklearn.libs DLLs
      run: |
        dir sklearn.libs\*.dll /s /b || echo "No DLLs found in workspace sklearn.libs"
      shell: cmd

    - name: Build with Nuitka
      uses: Nuitka/Nuitka-Action@v1.2
      with:
        script-name: main.py
        standalone: true
        onefile: false
        include-package: flet
        include-data-files: sklearn.libs/*.dll=sklearn.libs/
        output-dir: build
        report: build/compilation-report.xml
        extra-options: --mingw64 --clang

    - name: Debug List DLLs in build output
      run: |
        dir build\main.dist\sklearn.libs\*.dll /s /b || echo "No DLLs found in build output"
      shell: cmd

    - name: Upload Executable Artifact
      uses: actions/upload-artifact@v4
      with:
        name: minimal-flet-sklearn-executable
        path: build/main.dist/
        if-no-files-found: error

    - name: Upload Nuitka Build Report
      uses: actions/upload-artifact@v4
      with:
        name: nuitka-build-report
        path: build/compilation-report.xml
        if-no-files-found: error
