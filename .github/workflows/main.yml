name: Build Minimal Flet + Sklearn Executable with Nuitka

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Copy sklearn/.libs DLLs to sklearn/.libs
      run: |
        python -c "
        import os, shutil, sklearn
        src = os.path.join(os.path.dirname(sklearn.__file__), '.libs')
        dst = os.path.join(os.getcwd(), 'sklearn', '.libs')
        def copy_dlls(src, dst):
            if os.path.exists(src):
                os.makedirs(dst, exist_ok=True)
                for f in os.listdir(src):
                    if f.endswith('.dll'):
                        shutil.copy2(os.path.join(src, f), os.path.join(dst, f))
        if os.path.exists(src):
            copy_dlls(src, dst)
        else:
            print('No sklearn/.libs to copy')
        "

    - name: Remove hidden attribute from .libs (Windows only)
      run: |
        attrib -H sklearn\.libs
        attrib -H sklearn\.libs\*.dll
      shell: cmd

    - name: Upload sklearn/.libs DLLs artifact
      uses: actions/upload-artifact@v4
      with:
        name: sklearn-dlls
        path: sklearn/.libs/
        if-no-files-found: error

    - name: Build with Nuitka (MSVC)
      uses: Nuitka/Nuitka-Action@v1.2
      with:
        script-name: main.py
        standalone: true
        onefile: false
        include-package: flet
        include-data-files: |
          sklearn/.libs/*.dll=sklearn/.libs/
        output-dir: build
        report: build/compilation-report.xml
        msvc: latest
        no-deployment-flag: self-execution
        include-module: flet_desktop

    - name: Upload Executable Artifact
      uses: actions/upload-artifact@v4
      with:
        name: minimal-flet-sklearn-executable
        path: build/main.dist/
        if-no-files-found: error

    - name: Upload Nuitka Build Report
      uses: actions/upload-artifact@v4
      with:
        name: nuitka-build-report
        path: build/compilation-report.xml
        if-no-files-found: error
