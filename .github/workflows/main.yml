name: Build Minimal Flet + Sklearn Executable with Nuitka

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Copy sklearn/.libs DLLs to both .libs and sklearn.libs
      run: |
        python -c "import os, shutil, sklearn; \
src = os.path.join(os.path.dirname(sklearn.__file__), '.libs'); \
dst1 = os.path.join(os.getcwd(), 'sklearn', '.libs'); \
dst2 = os.path.join(os.getcwd(), 'sklearn.libs'); \
def copy_dlls(src, dst): \
    if os.path.exists(src): \
        os.makedirs(dst, exist_ok=True); \
        for f in os.listdir(src): \
            if f.endswith('.dll'): \
                shutil.copy2(os.path.join(src, f), os.path.join(dst, f)) \
if os.path.exists(src): \
    copy_dlls(src, dst1); \
    copy_dlls(src, dst2); \
else: \
    print('No sklearn/.libs to copy')"

    - name: Debug List copied sklearn/.libs DLLs
      run: |
        dir sklearn\.libs\*.dll /s /b || echo "No DLLs found in workspace sklearn/.libs"
        dir sklearn.libs\*.dll /s /b || echo "No DLLs found in workspace sklearn.libs"
      shell: cmd

    - name: Remove hidden attribute from .libs (Windows only)
      run: |
        attrib -H sklearn\.libs
        attrib -H sklearn\.libs\*.dll
        attrib -H sklearn.libs
        attrib -H sklearn.libs\*.dll
      shell: cmd

    - name: Zip sklearn .libs and sklearn.libs
      run: |
        powershell Compress-Archive -Path sklearn\.libs,sklearn.libs -DestinationPath dlls.zip

    - name: Upload DLLs zip artifact
      uses: actions/upload-artifact@v4
      with:
        name: sklearn-dlls-zip
        path: dlls.zip
        if-no-files-found: error

    - name: Build with Nuitka
      uses: Nuitka/Nuitka-Action@v1.2
      with:
        script-name: main.py
        standalone: true
        onefile: false
        include-package: flet
        include-data-files: |
          sklearn.libs/*.dll=sklearn.libs/
          sklearn/.libs/*.dll=sklearn/.libs/
        output-dir: build
        report: build/compilation-report.xml
        extra-options: --mingw64 --clang

    - name: Debug List DLLs in build output
      run: |
        dir build\main.dist\sklearn.libs\*.dll /s /b || echo "No DLLs found in build output sklearn.libs"
        dir build\main.dist\sklearn\.libs\*.dll /s /b || echo "No DLLs found in build output sklearn/.libs"
      shell: cmd

    - name: Upload Executable Artifact
      uses: actions/upload-artifact@v4
      with:
        name: minimal-flet-sklearn-executable
        path: build/main.dist/
        if-no-files-found: error

    - name: Upload Nuitka Build Report
      uses: actions/upload-artifact@v4
      with:
        name: nuitka-build-report
        path: build/compilation-report.xml
        if-no-files-found: error
