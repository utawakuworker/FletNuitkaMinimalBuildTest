name: Build Minimal Flet + Sklearn Executable with Nuitka

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install Visual C++ Redistributable
      uses: crazy-max/ghaction-chocolatey@v3
      with:
        args: install vcredist-all -y --no-progress

    - name: Debug: List sklearn .libs contents
      run: |
        python -c "import sklearn, os; print('sklearn.__file__:', sklearn.__file__); libs=os.path.join(os.path.dirname(sklearn.__file__), '.libs'); print('libs:', libs); print('contents:', os.listdir(libs) if os.path.exists(libs) else 'NO .libs DIR')"

    - name: Copy sklearn .libs directory if it exists
      run: |
        python -c "import sklearn, shutil, os; src=os.path.join(os.path.dirname(sklearn.__file__), '.libs'); dst=os.path.join(os.getcwd(), 'sklearn', '.libs'); os.makedirs(os.path.dirname(dst), exist_ok=True); shutil.copytree(src, dst, dirs_exist_ok=True) if os.path.exists(src) else print('No .libs to copy')"

    - name: Build with Nuitka
      uses: Nuitka/Nuitka-Action@v1.2
      with:
        script-name: main.py
        standalone: true
        onefile: false
        include-package: flet,sklearn
        include-data-dir: sklearn/.libs=sklearn/.libs
        output-dir: build

    - name: Verify DLL inclusion
      run: |
        echo "Checking for DLLs in build\\main.dist\\sklearn\\.libs"
        dir build\main.dist\sklearn\.libs\*.dll /s /b || echo "WARNING: DLLs not found!"
      shell: cmd

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: minimal-flet-sklearn-executable
        path: build/main.dist/
        if-no-files-found: error
