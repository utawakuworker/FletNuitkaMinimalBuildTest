name: Build Minimal Flet + Sklearn Executable with Nuitka

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Copy sklearn .libs directory if it exists
      run: |
        python -c "import sklearn, shutil, os; src=os.path.join(os.path.dirname(sklearn.__file__), '.libs'); dst=os.path.join('sklearn', '.libs'); os.makedirs(dst, exist_ok=True); [shutil.copy2(os.path.join(src, f), os.path.join(dst, f)) for f in os.listdir(src)] if os.path.exists(src) else print('No .libs to copy')"
    
    - name: Debug List copied sklearn .libs in workspace
      run: |
        dir sklearn\.libs\*.dll /s /b || echo "No DLLs found in workspace sklearn/.libs"
      shell: cmd
    
    - name: Build with Nuitka
      uses: Nuitka/Nuitka-Action@v1.2
      with:
        script-name: main.py
        standalone: true
        onefile: false
        include-package: flet
        include-data-files: sklearn/.libs/*.dll=sklearn/.libs/
        output-dir: build

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: minimal-flet-sklearn-executable
        path: build/main.dist/
        if-no-files-found: error
